<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Arial, sans-serif">
  <rect width="520" height="340" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Monthly signups</text>
  <!-- axes -->
  <line x1="60" y1="290" x2="490" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="290" stroke="#333" stroke-width="1.5"/>
  <!-- gridlines -->
  <line x1="60" y1="240" x2="490" y2="240" stroke="#ddd"/>
  <line x1="60" y1="190" x2="490" y2="190" stroke="#ddd"/>
  <line x1="60" y1="140" x2="490" y2="140" stroke="#ddd"/>
  <line x1="60" y1="90" x2="490" y2="90" stroke="#ddd"/>
  <text x="50" y="294" text-anchor="end" font-size="11" fill="#555">0</text>
  <text x="50" y="244" text-anchor="end" font-size="11" fill="#555">100</text>
  <text x="50" y="194" text-anchor="end" font-size="11" fill="#555">200</text>
  <text x="50" y="144" text-anchor="end" font-size="11" fill="#555">300</text>
  <text x="50" y="94" text-anchor="end" font-size="11" fill="#555">400</text>
  <!-- bars: value = (290 - y) * 2 -->
  <rect x="80" y="200" width="50" height="90" fill="#4e79a7"/>
  <rect x="150" y="130" width="50" height="160" fill="#4e79a7"/>
  <rect x="220" y="230" width="50" height="60" fill="#4e79a7"/>
  <rect x="290" y="95" width="50" height="195" fill="#4e79a7"/>
  <rect x="360" y="160" width="50" height="130" fill="#4e79a7"/>
  <rect x="430" y="115" width="50" height="175" fill="#4e79a7"/>
  <text x="105" y="308" text-anchor="middle" font-size="12" fill="#333">Jan</text>
  <text x="175" y="308" text-anchor="middle" font-size="12" fill="#333">Feb</text>
  <text x="245" y="308" text-anchor="middle" font-size="12" fill="#333">Mar</text>
  <text x="315" y="308" text-anchor="middle" font-size="12" fill="#333">Apr</text>
  <text x="385" y="308" text-anchor="middle" font-size="12" fill="#333">May</text>
  <text x="455" y="308" text-anchor="middle" font-size="12" fill="#333">Jun</text>
</svg>