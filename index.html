<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/editsvgcode-logo.svg" />
    <!--
      These tags are what a crawler that does not run JavaScript sees — AI
      crawlers (GPTBot, ClaudeBot, PerplexityBot) and Bing/Yandex largely do not,
      and social scrapers never do. <PageMeta> overwrites them in place once the
      app mounts, so there is only ever one of each.

      scripts/prerender.cjs replaces these per route at deploy time, so
      /features and friends serve their own title and description rather than
      the editor's. This file supplies the fallback and the home page's values.
    -->
    <title>Online SVG Code Editor</title>
    <meta name="description" content="Online SVG code editor with live preview, schema-aware autocomplete, hover docs, color picker, and cloud storage. AI chat and image generation available as pro features." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EditSVGCode — Online SVG Code Editor" />
    <meta property="og:description" content="Online SVG code editor with live preview, schema-aware autocomplete, hover docs, color picker, and cloud storage." />
    <!-- Absolute: scrapers do not resolve relative og:image URLs, so the card
         had no picture. Hard-coded to production on purpose — beta and
         localhost are never scraped, and a card pointing at prod beats none.
         Must stay the same picture as defaultImage in route-meta.json, which
         every other page uses; prerender.cjs fails the build if they diverge. -->
    <meta property="og:image" content="https://editsvgcode.com/screenshots/01-editor-full.png" />
    <base href="/" />
    <!--
      Pick the colour scheme before anything paints. MantineProvider applies it
      when it mounts, which is after the stylesheet has already drawn the page in
      light — so every load flashed white at anyone using dark mode, and any
      markup present before the bundle ran was themed wrongly. Inline and
      blocking on purpose: a deferred script is too late to matter.

      Same key and attribute Mantine itself uses, so the provider agrees with it
      rather than fighting it. "auto" and anything unrecognised fall through to
      the OS preference, which is what defaultColorScheme="auto" means.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {
          /* Private mode, or no matchMedia: the provider still sorts it out on mount. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
